<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Vision AI Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Kiosk Vision AI</h1>
            <div id="status">System Active</div>
        </header>
        
        <div class="video-box">
            <img src="/video" alt="Live AI Feed">
        </div>

        <div class="controls">
            <button class="btn primary-btn" onclick="captureText()">📸 Capture Text</button>
            <button class="btn secondary-btn" onclick="describeScene()">🌐 Describe Layout</button>
        </div>

        <div class="results-panel">
            <h3>Detection Output:</h3>
            <p id="output">Point your camera at a screen and select an option...</p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
